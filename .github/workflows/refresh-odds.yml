name: Refresh Betman and market odds

on:
  # 10시간 30분 간격, 주 16회(월 약 69회). 활성 7종목 x 2 markets = 최대 14 credits/run.
  # 두 계정 합계 월 약 966 credits로 30일 전체에 고르게 배분한다. 시간은 UTC다.
  schedule:
    - cron: "0 0,21 * * 0"
    - cron: "30 10 * * 0"
    - cron: "30 7 * * 1"
    - cron: "0 18 * * 1"
    - cron: "30 4 * * 2"
    - cron: "0 15 * * 2"
    - cron: "30 1,22 * * 3"
    - cron: "0 12 * * 3"
    - cron: "0 9 * * 4"
    - cron: "30 19 * * 4"
    - cron: "0 6 * * 5"
    - cron: "30 16 * * 5"
    - cron: "0 3 * * 6"
    - cron: "30 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and merge odds
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_EXPECTED_ACCOUNTS: "2"
          ODDS_REGIONS: eu
          ODDS_MAX_SPORTS_PER_RUN: "7"
          ODDS_REFRESH_INTERVAL_MINUTES: "630"
        run: python collector/collect_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/snapshots.json site/data/market_odds.json
          git diff --cached --quiet || git commit -m "Refresh odds data"
          git push
