name: Refresh Betman and market odds

on:
  # 44회/월: 1~22일에 하루 2회. 11개 종목 x (h2h+totals) x eu = 22 credits/run.
  # 두 계정에 번갈아 종목을 배분해 계정당 약 484 credits/month를 사용한다.
  schedule:
    - cron: "10 0 1-22 * *"
    - cron: "10 12 1-22 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and merge odds
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_EXPECTED_ACCOUNTS: "2"
          ODDS_REGIONS: eu
        run: python collector/collect_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/snapshots.json site/data/market_odds.json
          git diff --cached --quiet || git commit -m "Refresh odds data"
          git push
